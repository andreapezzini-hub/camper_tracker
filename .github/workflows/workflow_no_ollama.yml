name: Workflow without Ollama

on:
  workflow_dispatch:

jobs:
  run-workflow:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: 1. Clona il codice del repository
        uses: actions/checkout@v4

      - name: 2. Configura l'ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Installa le dipendenze Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 4. Esegui lo script principale di scraping
        run: python scripts/clear_annunci_table.py

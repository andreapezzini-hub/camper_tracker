name: Scraping Camper con Ollama e Turso

on:
  schedule:
    - cron: '0 8 * * *' # Esegue ogni giorno alle 08:00 UTC
  workflow_dispatch: # Permette l'avvio manuale dal sito di GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    # Iniettiamo le credenziali di Turso come variabili d'ambiente
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: 1. Clona il codice del repository
        uses: actions/checkout@v4

      - name: 2. Configura ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Installa le dipendenze Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 4. Installa e avvia Ollama (con cache)
        uses: pydantic/ollama-action@v3
        with:
          model: llama3.2 # Sostituisci con il modello leggero che usi (es. llama3:8b)

      - name: 5. Esegui lo script principale di scraping
        run: python main_engine.py

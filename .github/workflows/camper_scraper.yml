name: Main Scraper

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: 1. Clona il codice del repository
        uses: actions/checkout@v4

      - name: 2. Configura l'ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Installa le dipendenze Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 4. Installa e avvia Ollama ufficialmente
        run: |
          # Scarica e installa Ollama con lo script ufficiale
          curl -fsSL https://ollama.com/install.sh | sh
          
          # Avvia il server di Ollama in background
          ollama serve &
          
          # Attende qualche secondo che il servizio si avvii correttamente
          sleep 5
          
          # Scarica il modello che usi (es. phi3 o llama3)
          ollama pull llama3.2

      - name: 5. Esegui lo script principale di scraping
        run: python main_engine.py
        
      - name: 6. Committa e spingi il JSON aggiornato su GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Aggiornamento automatico dati camper (JSON)"
          file_pattern: "dati_storici.json"

name: Manual Specific Scraper - no AI

on:
  workflow_dispatch:
    inputs:
      scraper_script:
        description: 'Nome del file dello scraper (es. subito.py)'
        required: true
        default: ''
        type: string

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: 1. Clona il codice del repository
        uses: actions/checkout@v4

      - name: 2. Configura l'ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: 3. Installazione Chrome e ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 4. Installa le dipendenze Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 5. Installa browser e dipendenze di sistema (per Playwright)
        run: |
          playwright install --with-deps chromium

      - name: 6. Esegui lo script principale di scraping
        run: python main_engine.py ${{ github.event.inputs.scraper_script }} --no-ai
        
      - name: 7. Committa e spingi il JSON aggiornato su GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Aggiornamento automatico dati camper (JSON)"
          file_pattern: "dati_storici.json"